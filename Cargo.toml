[package]
autobins = false
default-run = "sleepreport"
edition = "2024"
license = "Apache-2.0"
name = "sleepreport"
publish = false
version = "0.1.0"

[[bin]]
name = "sleepreport"
path = "src/bin/sleepreport.rs"
test = false

[lints.rust]
non_ascii_idents = "forbid"
unsafe_code = "forbid"
unstable_features = "forbid"
unused_imports = "allow"

[profile.release]
lto = true

[dependencies]
anyhow = "1.0"
chrono = "0.4.41"
either = "1.15.0"
env_logger = {version = "0.11.8", default-features = false, features = ["auto-color", "humantime"]}
getopts = "0.2"
ical = {version = "0.11", default-features = false, features = ["ical"]}
ical_property = "0.1.3"
jiff = {version = "0.2.15", default-features = true, features = ["logging"]}
log = {version = "0.4", default-features = false, features = ["std"]}
tap = "1.0.1"

[build-dependencies]
barexp = "1.1.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
